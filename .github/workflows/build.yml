name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" "platforms;android-35"
      - run: chmod +x gradlew
      - run: ./gradlew :TMessagesProj_App:assembleAfatDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
